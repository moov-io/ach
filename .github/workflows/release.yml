# Use https://app.stepsecurity.io/ to improve workflow security
name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  testing:
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check
      run: make check

  release:
    permissions:
      contents: write
    name: Release
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: 'latest'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  webui:
    permissions:
      contents: write
      pull-requests: write
    name: WebUI
    needs: [testing, release]
    runs-on: ubuntu-latest
    # GITHUB_TOKEN cannot push master: required checks live in the Default
    # branch ruleset so Renovate can automerge, and classic protection cannot
    # exempt Actions. Open a PR and squash-merge after those checks pass.
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Switch to master
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        git fetch origin
        git checkout master

    - name: Distribute
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        make build-webui
        if git diff --quiet -- docs/webui/assets/wasm_exec.js docs/webui/assets/ach.wasm; then
          echo "No wasm changes"
          exit 0
        fi
        tag="${GITHUB_REF_NAME}"
        branch="chore/wasm-webui-${tag}"
        git config user.name "moov-bot"
        git config user.email "oss@moov.io"
        git checkout -B "$branch"
        git add docs/webui/assets/wasm_exec.js docs/webui/assets/ach.wasm
        git commit -m "chore: updating wasm webui"
        git push --force-with-lease origin "HEAD:refs/heads/${branch}"
        if ! gh pr view "$branch" >/dev/null 2>&1; then
          gh pr create --base master --head "$branch" \
            --title "chore: updating wasm webui" \
            --body "Generated WebUI wasm for \`${tag}\`."
        fi
        pr=$(gh pr view "$branch" --json number --jq .number)
        gh pr merge "$pr" --auto --squash --delete-branch
        for _ in $(seq 1 60); do
          state=$(gh pr view "$pr" --json state --jq .state)
          case "$state" in
            MERGED) exit 0 ;;
            CLOSED) echo "wasm PR #${pr} closed before merge"; exit 1 ;;
          esac
          sleep 30
        done
        echo "timed out waiting for wasm PR #${pr} to merge"
        exit 1

  docker:
    name: Docker ${{ matrix.arch }}
    if: github.repository_owner == 'moov-io' && !github.event.repository.fork
    needs: [testing, release]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Login to DockerHub
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push image
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        make docker-build-arch ARCH=${ARCH}
        make docker-push-arch ARCH=${ARCH}

  docker-manifest:
    name: Docker Manifest
    if: github.repository_owner == 'moov-io' && !github.event.repository.fork
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Login to DockerHub
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create and push manifests
      run: make docker-manifest
